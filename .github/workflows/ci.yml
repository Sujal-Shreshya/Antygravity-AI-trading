name: CI Pipeline - AI Trading Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-environment:
    name: Security & Environment Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets
        run: |
          echo "Verifying no .env files or credentials committed..."
          if git ls-files | grep -E "(^|\/)\.env$|\.env\.(local|production|staging)$"; then
            echo "ERROR: Disallowed .env file tracked in git repository!"
            exit 1
          fi
          echo "Secrets hygiene check passed."

  backend-check:
    name: Backend Lint, Test & Verification
    runs-on: ubuntu-latest
    needs: validate-environment
    env:
      LIVE_TRADING: "false"
      ENVIRONMENT: "test"
      JWT_SECRET: "ci_pipeline_dummy_test_secret_for_validation_only_12345"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/trading_test"
      DATABASE_URL_SYNC: "postgresql://postgres:postgres@localhost:5432/trading_test"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Formatting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint Code (Ruff)
        run: |
          # Check syntax and linting rules
          ruff check . --ignore E501

      - name: Check Formatting (Ruff)
        run: |
          ruff format --check .

  docker-syntax-check:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    needs: validate-environment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          # Verify compose syntax with fallback mock env
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid."
