
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL: Persistent source of truth for instruments, candles, orders,
  # trades, positions, risk logs, and backtest results.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

  # ----------------------------------------------------------------------------
  # Redis: High-performance cache, real-time market quote state, pub/sub,
  # and rate-limiting store.
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_network

  # ----------------------------------------------------------------------------
  # Backend API & Trading Engine: FastAPI, asyncio, SQLAlchemy, Pydantic
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: trading_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trading_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-trading_db}
      - REDIS_URL=redis://redis:6379/0
      - LIVE_TRADING=false
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend:ro
    networks:
      - trading_network

  # ----------------------------------------------------------------------------
  # Frontend Dashboard: React, TypeScript, Tailwind CSS, Lightweight Charts
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: trading_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - trading_network

volumes:
  postgres_data:
    name: trading_postgres_data
  redis_data:
    name: trading_redis_data

networks:
  trading_network:
    name: trading_network
    driver: bridge
